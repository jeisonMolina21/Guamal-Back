name: Deploy Guamal Backend (Villa MCJ)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue en Homeserver
    runs-on: self-hosted
    steps:
      - name: Actualizar código y reiniciar contenedor
        run: |
          echo "=============================================="
          echo "🚀 Desplegando Villa MCJ Backend..."
          echo "=============================================="
          cd /home/jm/production/villa-mcj
          
          # Actualizar repositorio en backend
          echo "📥 Descargando últimos cambios de main..."
          git -C backend pull origin main
          
          # Reconstruir contenedor Docker sin afectar otros servicios
          echo "🐳 Reconstruyendo villa_mcj_backend_prod..."
          docker compose up -d --build --no-deps villa-mcj-backend
          
          echo "✅ Despliegue completado con éxito!"
